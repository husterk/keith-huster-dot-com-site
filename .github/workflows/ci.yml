name: ci
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      CONTACT_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install --locked
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  preview:
    # Same-repo PRs only: forks never get credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install --locked
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Load Cloudflare token from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://secrets_keith-huster-dot-com-site/Cloudflare API token/credential
          CLOUDFLARE_ACCOUNT_ID: op://secrets_keith-huster-dot-com-site/Cloudflare API token/account id
      - name: Upload preview version
        id: upload
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          OUT=$(bunx wrangler versions upload --tag "pr-$PR_NUMBER" --message "$PR_TITLE" 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUT" | grep -Eo 'https://[a-z0-9-]+-keithhuster-com\.[a-z0-9-]+\.workers\.dev' | head -1)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `Preview deployed: ${url}\n\n(Worker version for this PR; production is untouched.)`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview deployed:'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
