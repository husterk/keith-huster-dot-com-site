name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - run: mise install --locked
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Runner images usually carry Chromium's system libraries; install them only if a launch fails.
      - run: >-
          bunx playwright install chromium &&
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" ||
          bunx playwright install --with-deps chromium
      - run: bun run build

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://secrets_keith-huster-dot-com-site/Cloudflare API token/credential
          CLOUDFLARE_ACCOUNT_ID: op://secrets_keith-huster-dot-com-site/Cloudflare API token/account id
          RESEND_API_KEY: op://secrets_keith-huster-dot-com-site/Resend/credential
          TURNSTILE_SECRET_KEY: op://secrets_keith-huster-dot-com-site/Turnstile/secret key

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          OUT=$(bunx wrangler deploy 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUT" | grep -Eo 'https://keithhuster-com\.[a-z0-9-]+\.workers\.dev' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Runs after the deploy: Cloudflare refuses secret edits while a newer, undeployed
      # version exists, and every PR preview upload creates one.
      - name: Sync Worker secrets from 1Password
        run: |
          jq -n --arg r "$RESEND_API_KEY" --arg t "$TURNSTILE_SECRET_KEY" \
            '{RESEND_API_KEY:$r, TURNSTILE_SECRET_KEY:$t}' | bunx wrangler secret bulk

      - name: Smoke check
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          test -n "$URL"
          sleep 5
          curl -sSf -o /dev/null "$URL/"
          curl -sSf -o /dev/null https://keithhuster.com/
          curl -sSf -I -o /dev/null https://keithhuster.com/Keith-Huster-Resume.pdf
