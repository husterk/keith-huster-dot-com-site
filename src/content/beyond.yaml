- id: beyond
  eyebrow: '05 · Beyond work'
  heading: 'More about me. Beyond the office.'
  feature:
    caption: 'Banff, AB → Antelope Wells, NM · 2025'
    title: 'Tour Divide finisher'
    body: >-
      Cycling 2,745 miles along the Continental Divide, self-supported, in 27 days: roughly a hundred miles
      of rough, rugged terrain per day. Constant planning, troubleshooting, and pacing with nobody else to
      hand the problems to. It's the same discipline I bring to a multi-quarter migration or a 3 a.m. incident.
    from: 'Mile 0 · Banff, AB (Canada)'
    to: 'Mile 2,745 · Antelope Wells, NM (Mexico Border)'
    profile:
      label: >-
        Tour Divide elevation profile: 2,745 miles from Banff, Alberta at about 4,500 feet, past Koko Claims,
        The Wall and Fleecer Ridge to the route's high point at Indiana Pass, 11,910 feet, then Pie Town and
        Hachita, and down to Antelope Wells, New Mexico, at about 4,500 feet.
