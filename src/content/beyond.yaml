- id: beyond
  eyebrow: '05 · Beyond work'
  heading: 'More about me. Beyond the office.'
  feature:
    caption: 'Banff, AB → Antelope Wells, NM · 2025'
    title: 'Tour Divide finisher'
    body: >-
      Cycling 2,745 miles along the Continental Divide, self-supported, in 27 days: roughly a hundred miles
      or rough, rugged terrain per day. Constant planning, troubleshooting, and pacing with nobody else to
      hand the problems to. It's the same discipline I bring to a multi-quarter migration or a 3 a.m. incident.
    from: 'Mile 0 · Baff, AB (Canada)'
    to: 'Mile 2,745 · Antelope Wells, NM (Mexico Border)'
  boxes:
    - caption: 'sunmanfire.com'
      title: 'Volunteer firefighter, Lieutenant'
      body: >-
        Twelve years (2004 – 2016) on the department, promoted to Lieutenant. Calm, clear communication under
        immense pressure is a skill I learned long before my first production incident. Firefighting taught me
        to stay calm, assess the situation, and make decisions quickly and effectively.
    - caption: 'github.com/husterk'
      title: 'HomeLab'
      body: >-
        A declarative, GitOps-driven lab on Proxmox VE, OPNsense, Talos Linux Kubernetes and Terraform with Atlantis.
        Managing a home lab is a great way to learn new technologies, stay sharp, and experiment with new ideas without
        risking production systems. It's also a great way to learn how to troubleshoot and debug complex systems, which
        is a skill that translates well to my work as a software engineer.
    - caption: 'KeithAndLindsey.com'
      title: 'Travel blog'
      body: >-
        Ghost CMS blog site with a fully custom theme, a GitHub Actions pipeline and two Cloudflare Workers handling
        webhooks and sitemaps. I built the site to share our travel experiences and to continue to hone my web development
        skills, including front-end design, back-end development, and deployment. The site is a great way to showcase
        my skills and to share my passion for travel with others.
