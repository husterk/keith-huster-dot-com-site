- id: leadership
  eyebrow: '03 · Leadership'
  heading: 'Six engineers. Eighteen months. Zero high-severity incidents.'
  paragraphs:
    - >-
      From April 2024 to September 2025 I managed Olo's six-engineer Software Infrastructure team as
      Team Lead II without leaving the code. I hired and onboarded two engineers, ran planning and
      one-on-ones, and when senior leadership mandated 24/7 coverage I designed the team's first L2
      on-call practice as a weekly rotation calibrated for engineer well-being. The team sustained
      greater than 99.9% availability with zero high-severity production incidents in that time.
    - >-
      I've mentored more than 20 engineers over my career, and I set technical direction through RFCs
      and design reviews rather than mandates; the shared libraries I own are relied on by 100+
      engineers across nearly every team at Olo. I'm equally effective as a Staff-level IC or as the
      manager clearing the path for the team.
  cells:
    - { value: '6', label: 'engineers managed as a hands-on lead' }
    - { value: '0', label: 'high-severity production incidents during my tenure' }
    - { value: '2', label: 'engineers hired and onboarded' }
    - { value: '20+', label: 'engineers mentored across my career' }
