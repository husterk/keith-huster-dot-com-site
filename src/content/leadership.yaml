- id: leadership
  eyebrow: '03 · Leadership'
  heading: 'Six engineers. Eighteen months. Zero high-severity incidents.'
  paragraphs:
    - >-
      From April 2024 to September 2025, I managed Olo's six-engineer Software Infrastructure team as
      Team Lead II without leaving the code. I hired and onboarded two Eastern European engineers, ran
      planning, and handled individual one-on-ones. When senior leadership mandated 24/7 support coverage,
      I designed the team's first L2 on-call practice as a weekly rotation calibrated for engineer
      well-being. The team sustained greater than {{availability}} availability with zero high-severity production
      incidents during that time.
    - >-
      I've mentored more than 20 engineers over my career, and I set technical direction through RFCs
      and design reviews rather than mandates; the shared libraries I own are relied on by {{libraryEngineers}}
      engineers across nearly every team at Olo. I'm equally effective as a Staff-level IC or as the
      Engineering Manager clearing the path for the team.
